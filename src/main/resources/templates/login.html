<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Iniciar sesión</title>

	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light container p-4">

	<div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
		<div class="card p-4 shadow" style="width: 350px;">
			<h3 class="card-title text-center mb-3">Iniciar sesión</h3>

			<form th:action="@{/login}" method="post">
				<div class="mb-3">
					<label for="email" class="form-label">Email</label>
					<input type="text" name="email" class="form-control" id="email" placeholder="email@iescamas.es"
						required>
				</div>

				<div class="mb-3">
					<label for="password" class="form-label">Contraseña</label>
					<input type="password" name="password" class="form-control" id="password" placeholder="Contraseña"
						required>
				</div>

				<div class="d-grid">
					<button type="submit" class="btn btn-success">Entrar</button>
				</div>
			</form>

			<!-- Mensajes de error / logout -->
			<div class="mt-3 text-center text-danger" th:if="${param.error}">
				Usuario o contraseña incorrectos
			</div>
			<div class="mt-3 text-center text-success" th:if="${param.logout}">
				Sesión cerrada
			</div>
		</div>
	</div>

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
