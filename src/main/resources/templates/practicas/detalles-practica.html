<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Detalles de la Práctica - Gestión Formación</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css" />
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

	<div th:replace="fragmentos/header :: header"></div>

	<main class="flex-fill container mt-4">

		<div class="row justify-content-center">
		    <div class="col-md-6"> 
                <div class="card shadow border-0">
		            <div class="card-header bg-primary text-white">
		                <h4 class="mb-0">
		                    <i class="bi bi-eye me-2"></i>
		                    <span>Detalles de la Práctica</span>
		                </h4>
		            </div>
		            <div class="card-body p-4">
                        
		                <div class="mb-3">
		                    <label class="form-label fw-bold">Alumno Asignado</label>
                            <div class="d-flex align-items-center">
                                <input type="text" th:value="${practica.alumno.apellidos + ', ' + practica.alumno.nombre}" class="form-control-plaintext" readonly>
                                <a th:href="@{/alumnos/detalles/{id}(id=${practica.alumno.id})}" class="btn btn-sm btn-outline-primary ms-2">
                                    <i class="bi bi-person"></i> Ver Perfil
                                </a>
                            </div>
		                </div>

		                <div class="mb-3">
		                    <label class="form-label fw-bold">Empresa de Destino</label>
                            <div class="d-flex align-items-center">
		                        <input type="text" th:value="${practica.empresa.nombre}" class="form-control-plaintext" readonly>
                                <a th:href="@{/empresas/detalles/{id}(id=${practica.empresa.id})}" class="btn btn-sm btn-outline-primary ms-2">
                                    <i class="bi bi-building"></i> Ver Empresa
                                </a>
                            </div>
		                </div>

		                <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Fecha de Inicio</label>
                                <input type="text" 
                                       th:value="${practica.fechaInicio != null ? #temporals.format(practica.fechaInicio, 'dd/MM/yyyy') : 'No establecida'}" 
                                       class="form-control-plaintext" readonly>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Fecha de Fin</label>
                                <input type="text" 
                                       th:value="${practica.fechaFin != null ? #temporals.format(practica.fechaFin, 'dd/MM/yyyy') : 'Pendiente'}" 
                                       class="form-control-plaintext" readonly>
                            </div>
                        </div>

		                <div class="mb-3">
		                    <label class="form-label fw-bold">Comentarios y Observaciones</label>
		                    <div class="p-3 bg-white border rounded shadow-sm text-muted" 
                                 th:text="${practica.comentarios != null and !practica.comentarios.isEmpty() ? practica.comentarios : 'Sin observaciones registradas.'}">
                            </div>
		                </div>

		                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
		                    <a th:href="@{/practicas}" class="btn btn-primary px-4">Volver</a>
		                </div>
		            </div>
		        </div>
		    </div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<div th:replace="fragmentos/footer :: footer"></div>

</body>
</html>
