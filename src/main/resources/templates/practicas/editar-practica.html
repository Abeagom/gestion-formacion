<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Editar Práctica - Gestión Formación</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css" />
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

	<div th:replace="fragmentos/header :: header"></div>

	<main class="flex-fill container mt-4">

		<div th:replace="~{fragmentos/alertas :: alertas}"></div>

		<div class="row justify-content-center">
			<div class="col-md-6">
				<div class="card shadow border-0">
					<div class="card-header bg-warning text-dark">
						<h4 class="mb-0">
							<i class="bi bi-pencil-square me-2"></i>
							<span>Editar Práctica</span>
						</h4>
					</div>
					<div class="card-body p-4">
						<form th:action="@{/practicas/guardar}" th:object="${practica}" method="post">
							<input type="hidden" th:field="*{id}">

							<div class="mb-3">
								<label class="form-label fw-bold">Alumno</label>
								<select th:field="*{alumno}" class="form-select" required>
									<option th:each="a : ${alumnos}" 
									        th:value="${a.id}" 
									        th:text="${a.apellidos + ', ' + a.nombre}"
											th:selected="${practica.alumno != null and a.id == practica.alumno.id}">
									</option>
								</select>
								<div class="text-danger mt-1" th:if="${#fields.hasErrors('alumno')}" th:errors="*{alumno}"></div>
							</div>

							<div class="mb-3">
								<label class="form-label fw-bold">Empresa</label>
								<select th:field="*{empresa}" class="form-select" required>
									<option th:each="e : ${empresas}" 
									        th:value="${e.id}" 
									        th:text="${e.nombre}"
											th:selected="${practica.empresa != null and e.id == practica.empresa.id}">
									</option>
								</select>
								<div class="text-danger mt-1" th:if="${#fields.hasErrors('empresa')}" th:errors="*{empresa}"></div>
							</div>

							<div class="mb-3">
							    <label class="form-label fw-bold">Fecha de inicio</label>
							    <input type="date" th:field="*{fechaInicio}" class="form-control" required>
							    <div class="text-danger mt-1" th:if="${#fields.hasErrors('fechaInicio')}" th:errors="*{fechaInicio}"></div>
							</div>

							<div class="mb-3">
							    <label class="form-label fw-bold">Fecha de fin</label>
							    <input type="date" th:field="*{fechaFin}" class="form-control">
							    <div class="text-danger mt-1" th:if="${#fields.hasErrors('fechaFin')}" th:errors="*{fechaFin}"></div>
							</div>

							<div class="mb-3">
								<label class="form-label fw-bold">Comentarios</label>
								<textarea th:field="*{comentarios}" class="form-control" rows="3"></textarea>
								<div class="text-danger mt-1" th:if="${#fields.hasErrors('comentarios')}" th:errors="*{comentarios}"></div>
							</div>

							<div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
								<a th:href="@{/practicas}" class="btn btn-secondary me-md-2">Cancelar</a>
								<button type="submit" class="btn btn-warning text-dark fw-bold">
									Actualizar Práctica
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>

	<div th:replace="fragmentos/footer :: footer"></div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
