<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Prácticas - Gestión Formación</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css" />
	<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

	<div th:replace="fragmentos/header :: header"></div>

	<main class="flex-fill container mt-4">

		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1>Gestión de Prácticas</h1>
			<a th:href="@{/practicas/nuevo}" class="btn btn-success shadow-sm">
				<i class="bi bi-plus-lg"></i> <span>Nueva Práctica</span>
			</a>
		</div>
		
		<div th:replace="fragmentos/alertas :: alertas"></div>

		<div class="card shadow-sm border-0">
			<div class="card-body p-0">
				<table id="tablaPracticas" class="table table-hover align-middle mb-0 shadow-sm">
					<thead class="table-dark">
						<tr>
							<th>Alumno</th>
							<th>Empresa</th>
							<th>Fecha Inicio</th>
							<th>Fecha Fin</th>
							<th class="text-center">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="practica : ${practicas}">
							<td class="fw-bold" th:text="${practica.alumno.apellidos + ', ' + practica.alumno.nombre}"></td>
							<td>
                                <span th:text="${practica.empresa.nombre}"></span>
                            </td>
							<td th:text="${#temporals.format(practica.fechaInicio, 'dd/MM/yyyy')}"></td>
							<td th:text="${practica.fechaFin != null ? #temporals.format(practica.fechaFin, 'dd/MM/yyyy') : 'Sin definir'}"></td>
							<td class="text-center">
								<div class="d-flex justify-content-center gap-2">
									<a th:href="@{/practicas/detalles/{id}(id=${practica.id})}"
										class="btn btn-info btn-sm"><i class="bi bi-eye"></i></a>
									<a th:href="@{/practicas/editar/{id}(id=${practica.id})}"
										class="btn btn-warning btn-sm"><i class="bi bi-pencil-square"></i></a>
										<form th:action="@{/practicas/eliminar/{id}(id=${practica.id})}" method="post" style="display:inline;">
										    <button type="submit" 
										            class="btn btn-danger btn-sm"
										            onclick="return confirm('¿Estás seguro de que deseas eliminar esta asignación de práctica?')">
										        <i class="bi bi-trash3"></i>
										    </button>
										</form>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</main>

	<div th:replace="fragmentos/footer :: footer"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
	<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
	<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
	<script th:inline="javascript">
		$(document).ready(function () {
			$('#tablaPracticas').DataTable({
				"columnDefs": [
					{"orderable": false, "targets": 4}
				],
				"language": {
					"search": "Buscar:",
					"lengthMenu": "Mostrar _MENU_ registros",
					"info": "Mostrando _START_ a _END_ de _TOTAL_ prácticas",
					"zeroRecords": "No se encontraron prácticas",
					"infoEmpty": "No hay datos disponibles",
					"paginate": {
						"first": "«",
						"last": "»",
						"next": "›",
						"previous": "‹"
					}
				},
				"paging": true,
				"lengthChange": true,
				"searching": true
			});
		});
	</script>
</body>

</html>
