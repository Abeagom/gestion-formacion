<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Empresas - Gestión Formación</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

	<div th:replace="fragmentos/header :: header"></div>

	<main class="flex-fill container mt-4">

		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1>Gestión de Empresas</h1>
			<a th:href="@{/empresas/nuevo}" class="btn btn-success shadow-sm">
				<i class="bi bi-plus-lg"></i> <span>Nueva Empresa</span>
			</a>
		</div>
		
		<div th:replace="fragmentos/alertas :: alertas"></div>

		<div class="card shadow-sm border-0">
			<div class="card-body p-0">
				<table id="tablaEmpresas" class="table table-hover align-middle mb-0 shadow-sm">
					<thead class="table-dark">
						<tr>
							<th>Nombre Empresa</th>
							<th>Persona de Contacto</th>
							<th>Email de Contacto</th>
							<th class="text-center">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="empresa : ${empresas}">
							<td class="fw-bold" th:text="${empresa.nombre}">Nombre</td>
							<td th:text="${empresa.tutorNombre}">Nombre Tutor</td>
							<td th:text="${empresa.tutorEmail}">email@empresa.com</td>
							<td class="text-center">
								<div class="d-flex justify-content-center gap-2">
									<a th:href="@{/empresas/detalles/{id}(id=${empresa.id})}"
										class="btn btn-outline-info btn-sm" title="Ver Detalles">
                                        <i class="bi bi-eye"></i>
                                    </a>
									<a th:href="@{/empresas/editar/{id}(id=${empresa.id})}"
										class="btn btn-outline-warning btn-sm" title="Editar">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
									<form th:action="@{/empresas/eliminar/{id}(id=${empresa.id})}" method="post" style="display:inline;">
									    <button type="submit" 
									            class="btn btn-outline-danger btn-sm"
									            onclick="return confirm('¿Está seguro de eliminar esta empresa?')">
									        <i class="bi bi-trash3"></i>
									    </button>
									</form>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</main>

	<div th:replace="fragmentos/footer :: footer"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
	<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
	<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
	
    <script th:inline="javascript">
		$(document).ready(function () {
			$('#tablaEmpresas').DataTable({
				"columnDefs": [
					{"orderable": false, "targets": 3} // Ahora la columna de acciones es la 3 (empezando de 0)
				],
				"language": {
					"search": "Buscar:",
					"lengthMenu": "Mostrar _MENU_ registros",
					"info": "Mostrando _START_ a _END_ de _TOTAL_ empresas",
					"zeroRecords": "No se encontraron resultados",
					"infoEmpty": "No hay empresas para mostrar",
					"paginate": {
						"first": "«",
						"last": "»",
						"next": "›",
						"previous": "‹"
					}
				},
				"paging": true,
				"lengthChange": true,
				"searching": true
			});
		});
	</script>
</body>
</html>
