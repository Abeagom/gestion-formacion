<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Empresas - Gestión Formación</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css" />
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

	<div th:replace="fragmentos/header :: header"></div>

	<main class="flex-fill container mt-4">

		<div th:replace="~{fragmentos/alertas :: alertas}"></div>

		<div class="row justify-content-center">
			<div class="col-md-6">
				<div class="card shadow border-0">
					<div class="card-header bg-warning text-dark">
						<h4 class="mb-0">
							<i class="bi bi-pencil-square me-2"></i>
							<span>Editar Empresa</span>
						</h4>
					</div>
					<div class="card-body p-4">
						<form th:action="@{/empresas/guardar}" th:object="${empresa}" method="post">
							<input type="hidden" th:field="*{id}">

							<div class="mb-3">
								<label class="form-label fw-bold">Nombre de la Empresa</label>
								<input type="text" th:field="*{nombre}" class="form-control" required>
								<div class="text-danger mt-1" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
							</div>

							<div class="mb-3">
								<label class="form-label fw-bold">Descripción</label>
								<textarea th:field="*{descripcion}" class="form-control" rows="3"></textarea>
								<div class="text-danger mt-1" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
							</div>

							<div class="mb-3">
								<label class="form-label fw-bold">Nombre del Tutor</label>
								<input type="text" th:field="*{tutorNombre}" class="form-control" required>
								<div class="text-danger mt-1" th:if="${#fields.hasErrors('tutorNombre')}" th:errors="*{tutorNombre}"></div>
							</div>

							<div class="mb-3">
								<label class="form-label fw-bold">Email del Tutor</label>
								<input type="email" th:field="*{tutorEmail}" class="form-control" required>
								<div class="text-danger mt-1" th:if="${#fields.hasErrors('tutorEmail')}" th:errors="*{tutorEmail}"></div>
							</div>

							<div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
								<a th:href="@{/empresas}" class="btn btn-secondary me-md-2">Cancelar</a>
								<button type="submit" class="btn btn-warning">
									Actualizar Empresa
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>

	<div th:replace="fragmentos/footer :: footer"></div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
