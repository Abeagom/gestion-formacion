<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Detalles Empresa - Gestión Formación</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css" />
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

	<div th:replace="fragmentos/header :: header"></div>

	<main class="flex-fill container mt-4">

		<div class="row justify-content-center">
		    <div class="col-md-6"> 
                <div class="card shadow border-0">
		            <div class="card-header bg-primary text-white">
		                <h4 class="mb-0">
		                    <i class="bi bi-eye me-2"></i>
		                    <span>Detalles de la Empresa</span>
		                </h4>
		            </div>
		            <div class="card-body p-4">
		                <div class="mb-3">
		                    <label class="form-label fw-bold">Nombre de la Empresa</label>
		                    <input type="text" th:value="${empresa.nombre}" class="form-control-plaintext" readonly>
		                </div>

		                <div class="mb-3">
		                    <label class="form-label fw-bold">Descripción</label>
		                    <p class="text-muted" th:text="${empresa.descripcion != null && !empresa.descripcion.isEmpty() ? empresa.descripcion : 'Sin descripción'}"></p>
		                </div>

		                <div class="mb-3">
		                    <label class="form-label fw-bold">Nombre del Tutor</label>
		                    <input type="text" th:value="${empresa.tutorNombre}" class="form-control-plaintext" readonly>
		                </div>

		                <div class="mb-3">
		                    <label class="form-label fw-bold">Email del Tutor</label>
		                    <input type="text" th:value="${empresa.tutorEmail}" class="form-control-plaintext" readonly>
		                </div>

		                <div class="mb-3">
		                    <label class="form-label fw-bold">Alumnos en Prácticas</label>
		                    
							<div th:if="${not #lists.isEmpty(empresa.practicas)}">
							    <div class="table-responsive border rounded p-2 shadow-sm bg-white">
							        <table class="table table-sm table-hover mb-0 align-middle">
							            <thead class="table-light">
							                <tr>
							                    <th class="ps-2">Alumno</th>
							                    <th class="text-end pe-2">Práctica</th>
							                </tr>
							            </thead>
							            <tbody>
							                <tr th:each="p : ${empresa.practicas}">
							                    <td class="ps-2">
							                        <a th:href="@{/alumnos/detalles/{id}(id=${p.alumno.id})}" 
							                           class="text-primary text-decoration-underline-hover fw-medium">
							                            <span th:text="${p.alumno.nombre + ' ' + p.alumno.apellidos}">Nombre Alumno</span>
							                        </a>
							                    </td>
							                    
							                    <td class="text-end pe-2">
													<a th:href="@{/practicas/detalles/{id}(id=${p.id})}" 
													   class="text-primary text-decoration-underline-hover fw-medium">
													    Ver detalles
													</a>
							                    </td>
							                </tr>
							            </tbody>
							        </table>
							    </div>
							</div>
                            
		                    <div th:unless="${not #lists.isEmpty(empresa.practicas)}"
		                        class="alert alert-light border d-flex align-items-center mb-0 py-2 shadow-sm">
		                        <i class="bi bi-info-circle-fill text-primary me-2"></i>
		                        <small class="text-muted">No hay prácticas registradas</small>
		                    </div>
		                </div>

		                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
		                    <a th:href="@{/empresas}" class="btn btn-primary px-4">Volver</a>
		                </div>
		            </div>
		        </div>
		    </div>
		</div>
	</main>

	<div th:replace="fragmentos/footer :: footer"></div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
