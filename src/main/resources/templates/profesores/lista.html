<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Profesores - Gestión Formación</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css" />
	<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

	<div th:replace="fragmentos/header :: header"></div>

	<main class="flex-fill container mt-4">

		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1>Gestión de Profesores</h1>
			<a th:href="@{/directiva/profesores/nuevo}" class="btn btn-success shadow-sm">
				<i class="bi bi-plus-lg"></i>Nuevo Profesor
			</a>
		</div>
		
		<div th:replace="fragmentos/alertas :: alertas"></div>

		<div class="card shadow-sm border-0">
			<div class="card-body p-0">
				<table id="tablaProfesores" class="table table-hover align-middle mb-0 shadow-sm">
					<thead class="table-dark">
						<tr>
							<th>Apellidos</th>
							<th>Nombre</th>
							<th>Email</th>
							<th>Tipo</th>
							<th class="d-flex justify-content-center gap-2">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="profesor : ${profesores}">
							<td th:text="${profesor.apellidos}" class="fw-bold"></td>
							<td th:text="${profesor.nombre}" class="fw-bold"></td>
							<td th:text="${profesor.email}"></td>
							<td th:text="${profesor.tipo}"></td>
							<td class="text-center">
								<div class="d-flex justify-content-center gap-2">
									<a th:href="@{/directiva/profesores/detalles/{id}(id=${profesor.id})}"
										class="btn btn-info btn-sm"><i class="bi bi-eye"></i></a>
									<a th:href="@{/directiva/profesores/editar/{id}(id=${profesor.id})}"
										class="btn btn-warning btn-sm"><i class="bi bi-pencil-square"></i></a>
										<form th:action="@{/directiva/profesores/eliminar/{id}(id=${profesor.id})}" method="post" style="display:inline;">
										    <button type="submit" 
										            class="btn btn-danger btn-sm"
										            th:onclick="return confirm('¿Estás seguro de que deseas eliminar este profesor?')">
										        <i class="bi bi-trash3"></i>
										    </button>
										</form>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</main>


	<div th:replace="fragmentos/footer :: footer"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
	<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
	<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
	<script th:inline="javascript">
		$(document).ready(function () {
			$('#tablaProfesores').DataTable({
				"columnDefs": [
					{"orderable": false, "targets": 4} // La columna de acciones no se ordena
				],
				"language": {
				    "search": "Buscar:",
				    "lengthMenu": "Mostrar _MENU_ profesores", // Aquí lo personalizas a mano
				    "info": "Mostrando _START_ a _END_ de _TOTAL_ profesores",
				    "zeroRecords": "No se han encontrado profesores",
				    "infoEmpty": "No hay profesores disponibles",
				    "paginate": {
				        "first": "Primero",
				        "last": "Último",
				        "next": "Siguiente",
				        "previous": "Anterior"
				    }
				},
				"paging": true,
				"lengthChange": true, // Para que se pueda elegir cuántos ver
				"searching": true
			});
		});
	</script>
</body>

</html>
