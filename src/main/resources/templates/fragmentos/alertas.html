<div th:fragment="alertas">
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${error}">Mensaje de error por defecto</span> <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
	
	<div th:if="${errores}" class="alert alert-danger alert-dismissible fade show" role="alert">
	        <div class="d-flex align-items-center mb-2">
	            <i class="bi bi-list-task me-2"></i>
	            <strong>Se han detectado errores en el archivo:</strong>
	        </div>
	        <ul class="mb-0 small" style="max-height: 150px; overflow-y: auto;">
	            <li th:each="err : ${errores}" th:text="${err}"></li>
	        </ul>
	        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
	    </div>

    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${exito}">Mensaje de éxito por defecto</span> <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>
