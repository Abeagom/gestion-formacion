<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Alumnos - Gestión Formación</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css" />
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

	<div th:replace="fragmentos/header :: header"></div>

	<main class="flex-fill container mt-4">

		<div class="row justify-content-center">
		    <div class="col-md-6"> <div class="card shadow border-0">
		            <div class="card-header bg-primary text-white">
		                <h4 class="mb-0">
		                    <i class="bi bi-eye me-2"></i>
		                    <span th:text="#{alumnos.boton.detalles}">Detalles del Alumno</span>
		                </h4>
		            </div>
		            <div class="card-body p-4">
		                <div class="mb-3">
		                    <label class="form-label fw-bold" th:text="#{alumnos.tabla.nombre}">Nombre</label>
		                    <input type="text" th:value="${alumno.nombre}" class="form-control-plaintext" readonly>
		                </div>

		                <div class="mb-3">
		                    <label class="form-label fw-bold" th:text="#{alumnos.tabla.apellidos}">Apellidos</label>
		                    <input type="text" th:value="${alumno.apellidos}" class="form-control-plaintext" readonly>
		                </div>

		                <div class="mb-3">
		                    <label class="form-label fw-bold" th:text="#{alumnos.tabla.email}">Email</label>
		                    <input type="text" th:value="${alumno.email}" class="form-control-plaintext" readonly>
		                </div>

		                <div class="mb-3">
		                    <label class="form-label fw-bold" th:text="#{alumnos.tabla.fechaNacimiento}">Fecha de nacimiento</label>
		                    <input type="text" 
		                           th:value="${alumno.fechaNacimiento != null ? #temporals.format(alumno.fechaNacimiento, 'dd/MM/yyyy') : ''}" 
		                           class="form-control-plaintext" readonly>
		                </div>

		                <div class="mb-3">
		                    <label class="form-label fw-bold" th:text="#{alumnos.tabla.curso}">Curso</label>
		                    <div th:if="${alumno.curso != null}">
		                        <input type="text" th:value="${alumno.curso.nombre}" class="form-control-plaintext" readonly>
		                    </div>
		                    <div th:unless="${alumno.curso != null}"
		                        class="alert alert-light border d-flex align-items-center mb-0 py-2 shadow-sm">
		                        <i class="bi bi-info-circle-fill text-primary me-2"></i>
		                        <small class="text-muted">
		                            <span th:text="#{alumnos.mensaje.sinCursoAsignado}">Aún no tiene curso asignado</span>
		                        </small>
		                    </div>
		                </div>

		                <div class="mb-3">
		                    <label class="form-label fw-bold" th:text="#{alumnos.tabla.practica}">Práctica</label>
		                    <div th:if="${alumno.practica != null}">
		                        <a th:href="@{/practicas/detalles/{id}(id=${alumno.practica.id})}"
		                           th:text="${alumno.practica.descripcion}" class="d-block py-2"></a>
		                    </div>
		                    <div th:unless="${alumno.practica != null}"
		                        class="alert alert-light border d-flex align-items-center mb-0 py-2 shadow-sm">
		                        <i class="bi bi-info-circle-fill text-primary me-2"></i>
		                        <small class="text-muted">
		                            <span th:text="#{alumnos.mensaje.sinPracticas}">Aún no tiene práctica asignada</span>
		                        </small>
		                    </div>
		                </div>

		                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
		                    <a th:href="@{/alumnos}" class="btn btn-primary px-4"
		                        th:text="#{boton.volver}">Volver</a>
		                </div>
		            </div>
		        </div>
		    </div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<div th:replace="fragmentos/footer :: footer"></div>

</body>

</html>
