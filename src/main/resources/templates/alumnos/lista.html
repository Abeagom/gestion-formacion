<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Alumnos - Gestión Formación</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css" />
	<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

	<div th:replace="fragmentos/header :: header"></div>

	<main class="flex-fill container mt-4">

		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1 th:text="#{alumnos.titulo}">Gestión de Alumnos</h1>
			<a th:href="@{/alumnos/nuevo}" class="btn btn-success shadow-sm">
				<i class="bi bi-plus-lg"></i> <span th:text="#{alumnos.boton.nuevo}">Nuevo Alumno</span>
			</a>
		</div>
		
		<div th:replace="fragmentos/alertas :: alertas"></div>

		<div class="card shadow-sm border-0">
			<div class="card-body p-0">
				<table id="tablaAlumnos" class="table table-hover align-middle mb-0 shadow-sm">
					<thead class="table-dark">
						<tr>
							<th th:text="#{alumnos.tabla.apellidos}">Apellidos</th>
							<th th:text="#{alumnos.tabla.nombre}">Nombre</th>
							<th th:text="#{alumnos.tabla.email}">Email</th>
							<th th:text="#{alumnos.tabla.curso}">Curso</th>
							<th th:text="#{alumnos.tabla.practica}">Práctica</th>
							<th class="text-center" th:text="#{alumnos.tabla.acciones}">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="alumno : ${alumnos}">
							<td th:text="${alumno.apellidos}" class="fw-bold"></td>
							<td th:text="${alumno.nombre}"></td>
							<td th:text="${alumno.email}"></td>
							<td> <span th:if="${alumno.curso != null}" th:text="${alumno.curso.nombre}"
									></span>
								<span th:unless="${alumno.curso != null}" class="text-danger">Sin curso asignado</span>
							</td>
							<td>
							    <span th:if="${alumno.practica != null}">
							        <span th:text="${alumno.practica.empresa.nombre}">Nombre Empresa</span>
							    </span>
							    
							    <span th:unless="${alumno.practica != null}"  class="text-danger">
							        Sin práctica asignada
							    </span>
							</td>
							<td class="text-center">
								<div class="d-flex justify-content-center gap-2">
									<a th:href="@{/alumnos/detalles/{id}(id=${alumno.id})}"
										class="btn btn-info btn-sm"><i class="bi bi-eye"></i></a>
									<a th:href="@{/alumnos/editar/{id}(id=${alumno.id})}"
										class="btn btn-warning btn-sm"><i class="bi bi-pencil-square"></i></a>
										<form th:action="@{/alumnos/eliminar/{id}(id=${alumno.id})}" method="post" style="display:inline;">
										    <button type="submit" 
										            class="btn btn-danger btn-sm"
										            th:onclick="return confirm([[#{alumnos.js.confirmar.eliminar}]])">
										        <i class="bi bi-trash3"></i>
										    </button>
										</form>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

		<div class="card mt-4 shadow-sm border-0">
			<div class="card-body rounded">
				<h5 class="card-title h6 fw-bold text-uppercase text-secondary" th:text="#{alumnos.boton.importar}">
					Importar Alumnos</h5>
				<form th:action="@{/alumnos/importar}" method="post" enctype="multipart/form-data" class="row g-2 mt-1">
					<div class="col-auto">
						<input type="file" name="ficheroCsv" class="form-control form-control-sm" accept=".csv" required>
					</div>
					<div class="col-auto">
						<button type="submit" class="btn btn-dark btn-sm">
							<i class="bi bi-upload"></i> <span th:text="#{alumnos.boton.subir}">Subir CSV</span>
						</button>
					</div>
				</form>
			</div>
		</div>
	</main>


	<div th:replace="fragmentos/footer :: footer"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
	<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
	<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
	<script th:inline="javascript">
		$(document).ready(function () {
			$('#tablaAlumnos').DataTable({
				"columnDefs": [
					{"orderable": false, "targets": 5} // La columna de acciones no se ordena
				],
				"language": {
					"search": [[#{tabla.buscar}]],
					"lengthMenu": [[#{tabla.mostrar}]],
					"info": [[#{tabla.info}]],
					"zeroRecords": [[#{tabla.vacia}]],
					"infoEmpty": [[#{tabla.vacia}]],
					"paginate": {
						"first": "«",
						"last": "»",
						"next": "›",
						"previous": "‹"
					}
				},
				"paging": true,
				"lengthChange": true, // Para que se pueda elegir cuántos ver
				"searching": true
			});
		});
	</script>
</body>

</html>
