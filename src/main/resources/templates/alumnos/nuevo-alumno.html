<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Alumnos - Gestión Formación</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css" />
	<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

	<div th:replace="fragmentos/header :: header"></div>

	<main class="flex-fill container mt-4">

		<div th:replace="fragmentos/alertas :: alertas"></div>
		
		<div class="row justify-content-center">
			<div class="col-md-6">
				<div class="card shadow border-0">
					<div class="card-header bg-success text-white">
						<h4 class="mb-0" th:text="#{alumnos.boton.nuevo}">Nuevo Alumno</h4>
					</div>
					<div class="card-body p-4">
						<form th:action="@{/alumnos/guardar}" th:object="${alumno}" method="post">
							<input type="hidden" th:field="*{id}">

							<div class="mb-3">
								<label class="form-label" th:text="#{alumnos.tabla.nombre}">Nombre</label>
								<input type="text" th:field="*{nombre}" class="form-control" required>
								<div class="text-danger mt-1" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
							</div>

							<div class="mb-3">
								<label class="form-label" th:text="#{alumnos.tabla.apellidos}">Apellidos</label>
								<input type="text" th:field="*{apellidos}" class="form-control" required>
								<div class="text-danger mt-1" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></div>
							</div>

							<div class="mb-3">
								<label class="form-label" th:text="#{alumnos.tabla.email}">Email</label>
								<input type="email" th:field="*{email}" class="form-control" required>
								<div class="text-danger mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
							</div>
							
							<div class="mb-3">
							    <label class="form-label" th:text="#{alumnos.tabla.fechaNacimiento}">Fecha de nacimiento</label>
							    <input type="date" th:field="*{fechaNacimiento}" class="form-control" required>
							    <div class="text-danger mt-1" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></div>
							</div>

							<div class="mb-3">
							    <label class="form-label" th:text="#{alumnos.tabla.curso}">Curso</label>
							    
							    <div th:if="${not #lists.isEmpty(cursos)}">
							        <select th:field="*{curso}" class="form-select">
							            <option value="" th:text="#{combo.seleccionar}">-- Selecciona un curso (Opcional) --</option>
							            <option th:each="c : ${cursos}" th:value="${c.id}" th:text="${c.nombre}"></option>
							        </select>
							    </div>

							    <div th:unless="${not #lists.isEmpty(cursos)}" class="alert alert-light border d-flex align-items-center mb-0 py-2 shadow-sm">
							        <i class="bi bi-info-circle-fill text-success me-2"></i>
							        <small class="text-muted">
							            <span th:text="#{alumnos.mensaje.sinCursos}">Aún no hay cursos registrados</span>
							        </small>
							        </div>
							</div>

							<div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
								<a th:href="@{/alumnos}" class="btn btn-secondary me-md-2"
									th:text="#{boton.cancelar}">Cancelar</a>
								<button type="submit" class="btn btn-success" th:text="#{boton.guardar}">Guardar
									Alumno</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>


	<div th:replace="fragmentos/footer :: footer"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
