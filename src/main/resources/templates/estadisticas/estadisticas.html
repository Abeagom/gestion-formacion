<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Estadísticas - Gestión Formación</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css" />
	<script src="https://code.highcharts.com/highcharts.js"></script>
	<script src="https://code.highcharts.com/modules/exporting.js"></script>
	<script src="https://code.highcharts.com/modules/export-data.js"></script>
	<script src="https://code.highcharts.com/modules/accessibility.js"></script>
	<script src="https://code.highcharts.com/themes/adaptive.js"></script>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

	<div th:replace="fragmentos/header :: header"></div>

	<main class="flex-fill container mt-4">
		<div class="row mb-4">
			<div class="col">
				<h2 class="fw-bold text-dark"><i class="bi bi-pie-chart-fill me-2 text-primary"></i>Panel de
					Estadísticas</h2>
				<p class="text-muted">Resumen visual de alumnos en prácticas por empresa y curso.</p>
			</div>
		</div>

		<div class="row g-4">
			<div class="col-12">
				<div class="card h-100">
					<div class="card-body">
						<div id="chartEmpresas"></div>
					</div>
				</div>
			</div>
		</div>

			<div class="row g-4 mt-4">
				<div class="col-12">
					<div class="card h-100">
						<div class="card-body">
							<div id="chartCursos"></div>
						</div>
					</div>
				</div>
			</div>

			<div class="row mt-4 mb-5">
				<div class="col text-center">
					<a href="/" class="btn btn-secondary px-4 shadow-sm">
						<i class="bi bi-arrow-left me-2"></i>Volver al Inicio
					</a>
				</div>
			</div>
	</main>

	<div th:replace="fragmentos/footer :: footer"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

	<script th:inline="javascript">
		
		//Gráfica de alumnos con prácticas por empresas
		Highcharts.chart('chartEmpresas', {
			chart: {
				type: 'column'
			},
			title: {
				text: 'Alumnos con prácticas por empresas'
			},
			xAxis: {
				categories: [[${nombresEmpresas}]],
				crosshair: true,
				accessibility: {
					description: 'Empresas'
				}
			},
			yAxis: {
				min: 0,
				title: {
					text: 'Número de alumnos'
				}
			},
			tooltip: {
				valueSuffix: ' (alumnos)'
			},
			plotOptions: {
				column: {
					pointPadding: 0.2,
					borderWidth: 0
				}
			},
			series: [
				{
					name: 'Empresas',
					colorByPoint: true, 
					data: [[${valoresEmpresas}]]
				}
			]
		});

		//Gráfica de alumnos con prácticas por cursos
		Highcharts.chart('chartCursos', {
		    chart: {
		        type: 'pie',
		        zooming: {
		            type: 'xy'
		        },
		        panning: {
		            enabled: true,
		            type: 'xy'
		        },
		        panKey: 'shift'
		    },
		    title: {
		        text: 'Alumnos con prácticas por curso'
		    },
		    tooltip: {
		        valueSuffix: ''
		    },
		    plotOptions: {
		        pie: {
		            allowPointSelect: true,
		            cursor: 'pointer',
		            dataLabels: [{
		                enabled: true,
		                distance: 20
		            }, {
		                enabled: true,
		                distance: -40,
		                format: '{point.percentage:.1f}%',
		                style: {
		                    fontSize: '1.2em',
		                    textOutline: 'none',
		                    opacity: 0.7
		                },
		                filter: {
		                    operator: '>',
		                    property: 'percentage',
		                    value: 0
		                }
		            }]
		        }
		    },
			series: [{
			    name: 'Alumnos',
			    colorByPoint: true,
			    data: [[${nombresCursos}]].map((nombre, i) => ({
			        name: nombre,
			        y: [[${valoresCursos}]][i]
			    }))
			}]

		});

	</script>

</body>

</html>
