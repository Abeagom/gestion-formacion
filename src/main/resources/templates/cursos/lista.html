<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Cursos - Gestión Formación</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css" />
	<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

	<div th:replace="fragmentos/header :: header"></div>

	<main class="flex-fill container mt-4">

		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1>Gestión de Cursos</h1>
			<a th:href="@{/directiva/cursos/nuevo}" class="btn btn-success shadow-sm">
				<i class="bi bi-plus-lg"></i> <span>Nuevo Curso</span>
			</a>
		</div>
		
		<div th:replace="fragmentos/alertas :: alertas"></div>

		<div class="card shadow-sm border-0">
			<div class="card-body p-0">
				<table id="tablaCursos" class="table table-hover align-middle mb-0 shadow-sm">
					<thead class="table-dark">
						<tr>
							<th>Nombre</th>
							<th>Tutor</th>
							<th class="text-center">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="curso : ${cursos}">
							<td th:text="${curso.nombre}"></td>
							<td> <span th:if="${curso.tutor != null}" th:text="|${curso.tutor.nombre} ${curso.tutor.apellidos}|"
									class="badge bg-info text-dark"></span>
								<span th:unless="${curso.tutor != null}">Sin tutor asignado</span>
							</td>
							<td class="text-center">
								<div class="d-flex justify-content-center gap-2">
									<a th:href="@{/directiva/cursos/detalles/{id}(id=${curso.id})}"
										class="btn btn-outline-info btn-sm"><i class="bi bi-eye"></i></a>
									<a th:href="@{/directiva/cursos/editar/{id}(id=${curso.id})}"
										class="btn btn-outline-warning btn-sm"><i class="bi bi-pencil-square"></i></a>
										<form th:action="@{/directiva/cursos/eliminar/{id}(id=${curso.id})}" method="post" style="display:inline;">
										    <button type="submit" 
										            class="btn btn-outline-danger btn-sm"
										            th:onclick="return confirm('¿Estás seguro de que deseas eliminar este curso?')">
										        <i class="bi bi-trash3"></i>
										    </button>
										</form>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</main>


	<div th:replace="fragmentos/footer :: footer"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
	<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
	<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
	<script th:inline="javascript">
		$(document).ready(function () {
			$('#tablaCursos').DataTable({
				"columnDefs": [
					{"orderable": false, "targets": 2} // La columna de acciones no se ordena
				],
				"language": {
				    "url": "//cdn.datatables.net/plug-ins/1.10.25/i18n/Spanish.json"
				},
				"paging": true,
				"lengthChange": true, // Para que se pueda elegir cuántos ver
				"searching": true
			});
		});
	</script>
</body>

</html>
