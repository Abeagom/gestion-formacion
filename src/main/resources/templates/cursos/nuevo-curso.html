<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Cursos - Gestión Formación</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css" />
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

	<div th:replace="fragmentos/header :: header"></div>

	<main class="flex-fill container mt-4">

		<div th:replace="fragmentos/alertas :: alertas"></div>

		<div class="row justify-content-center">
			<div class="col-md-6">
				<div class="card shadow border-0">
					<div class="card-header bg-success text-white">
						<h4 class="mb-0">Nuevo Curso</h4>
					</div>
					<div class="card-body p-4">
						<form th:action="@{/directiva/cursos/guardar}" th:object="${curso}" method="post">
							<input type="hidden" th:field="*{id}">

							<div class="mb-3">
								<label class="form-label fw-bold">Nombre</label>
								<input type="text" th:field="*{nombre}" class="form-control" required>
								<div class="text-danger mt-1" th:if="${#fields.hasErrors('nombre')}"
									th:errors="*{nombre}"></div>
							</div>

							<div class="mb-3">
								<label class="form-label fw-bold">Tutor</label>

								<div th:if="${not #lists.isEmpty(profesores)}">
									<select th:field="*{tutor}" class="form-select">
										<option value="">Sin tutor</option>
										<option th:each="p : ${profesores}" th:value="${p.id}"
											th:text="|${p.nombre} ${p.apellidos}|"></option>
									</select>
								</div>

								<div th:unless="${not #lists.isEmpty(profesores)}"
									class="alert alert-light border d-flex align-items-center mb-0 py-2 shadow-sm">
									<i class="bi bi-info-circle-fill text-success me-2"></i>
									<small class="text-muted">
										<span>Aún no hay profesores registrados</span>
									</small>
								</div>
							</div>
							<div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
								<a th:href="@{/directiva/cursos}" class="btn btn-secondary me-md-2">Cancelar</a>
								<button type="submit" class="btn btn-success">Guardar
									Curso</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>


	<div th:replace="fragmentos/footer :: footer"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
