<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Cursos - Gestión Formación</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css" />
	<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

	<div th:replace="fragmentos/header :: header"></div>

	<main class="flex-fill container mt-4">

		<div th:replace="fragmentos/alertas :: alertas"></div>
		
		<div class="row justify-content-center">
			<div class="col-md-6">
				<div class="card shadow border-0">
					<div class="card-header bg-success text-white">
						<h4 class="mb-0">Nuevo Curso</h4>
					</div>
					<div class="card-body p-4">
						<form th:action="@{directiva/cursos/guardar}" th:object="${curso}" method="post">
							<input type="hidden" th:field="*{id}">
							
							<div class="mb-3">
								<label class="form-label">Nombre</label>
								<input type="text" th:field="*{nombre}" class="form-control" required>
								<div class="text-danger mt-1" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
							</div>





							<div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
								<a th:href="@{/directiva/cursos}" class="btn btn-secondary me-md-2"
									>Cancelar</a>
								<button type="submit" class="btn btn-success">Guardar
									Curso</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>


	<div th:replace="fragmentos/footer :: footer"></div>

</body>

</html>
