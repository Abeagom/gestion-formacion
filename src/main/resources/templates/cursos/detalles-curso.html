<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Alumnos - Gestión Formación</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css" />
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

	<div th:replace="fragmentos/header :: header"></div>

	<main class="flex-fill container mt-4">

		<div class="row justify-content-center">
		    <div class="col-md-6"> <div class="card shadow border-0">
		            <div class="card-header bg-primary text-white">
		                <h4 class="mb-0">
		                    <i class="bi bi-eye me-2"></i>
		                    <span th:text="#{alumnos.boton.detalles}">Detalles del Curso</span>
		                </h4>
		            </div>
		            <div class="card-body p-4">
		                <div class="mb-3">
		                    <label class="form-label fw-bold">Nombre</label>
		                    <input type="text" th:value="${curso.nombre}" class="form-control-plaintext" readonly>
		                </div>

						<div class="mb-3">
						    <label class="form-label fw-bold">Tutor</label>
						    <div th:if="${curso.tutor != null}">
						        <input type="text" th:value="|${curso.tutor.nombre} ${curso.tutor.apellidos}|" class="form-control-plaintext" readonly>
						    </div>
						    <div th:unless="${curso.tutor != null}"
						        class="alert alert-light border d-flex align-items-center mb-0 py-2 shadow-sm">
						        <i class="bi bi-info-circle-fill text-primary me-2"></i>
						        <small class="text-muted">
						            <span>Aún no tiene tutor asignado</span>
						        </small>
						    </div>
						</div>

						<div class="mb-3">
						    <label class="form-label fw-bold">Alumnos Inscritos</label>
						    
						    <div th:if="${not #lists.isEmpty(curso.alumnos)}" class="list-group">
						        <div th:each="a : ${curso.alumnos}" class="list-group-item d-flex justify-content-between align-items-center">
						            <span th:text="| ${a.apellidos}, ${a.nombre}|">Nombre completo Alumno</span>
						            <small class="text-muted" th:text="${a.email}"></small>
						        </div>
						    </div>

						    <div th:unless="${not #lists.isEmpty(curso.alumnos)}"
						        class="alert alert-light border d-flex align-items-center mb-0 py-2 shadow-sm">
						        <i class="bi bi-info-circle-fill text-warning me-2"></i>
						        <small class="text-muted">No hay alumnos inscritos en este curso.</small>
						    </div>
						</div>

		                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
		                    <a th:href="@{/directiva/cursos}" class="btn btn-primary px-4"
		                        th:text="#{boton.volver}">Volver</a>
		                </div>
		            </div>
		        </div>
		    </div>
		</div>
	</main>

	<div th:replace="fragmentos/footer :: footer"></div>

</body>

</html>
